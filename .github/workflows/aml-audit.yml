name: AML audit checks

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:

jobs:
  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn
      - name: Compile Python sources
        run: python -m compileall -q src dashboard tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Reconcile published summary arithmetic
        run: python -m src.audit_frozen_metrics > /tmp/aml_summary_audit.json
